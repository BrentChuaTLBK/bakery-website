<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#fefaef">
  <title>Kitchen dashboard · The Little Baker Kitchen</title>
  <link rel="icon" href="assets/img/brands/Hat.png">
  <link rel="stylesheet" href="assets/ordering/ordering.css?v=close-icons-1">
  <link rel="stylesheet" href="assets/ordering/manage.css?v=sales-tooltip-width-1">
  <link rel="stylesheet" href="assets/ordering/dashboard-nav.css?v=grouped-nav-1">
  <link rel="stylesheet" href="assets/ordering/order-calendar.css?v=fulfillment-calendar-1">
  <link rel="stylesheet" href="assets/ordering/pos.css?v=direct-order-edits-1">
  <link rel="stylesheet" href="assets/ordering/site-dialog.css?v=branded-dialogs-1">
  <link rel="stylesheet" href="assets/ordering/accounting.css?v=excel-borders-3">
  <link rel="stylesheet" href="assets/ordering/gallery.css?v=mobile-controls-1">
  <link rel="stylesheet" href="assets/ordering/party-packages.css?v=package-tools-1">
  <link rel="stylesheet" href="assets/ordering/party-cart-photos.css?v=details-swipe-1">
  <link rel="stylesheet" href="assets/ordering/catalog-order.css?v=drag-order-1">
  <link rel="stylesheet" href="assets/ordering/academy-manager.css?v=close-icons-1">
  <link rel="stylesheet" href="assets/ordering/payment-options.css?v=payment-options-1">
  <link rel="stylesheet" href="assets/ordering/shop-settings.css?v=settings-layout-2">
  <link rel="stylesheet" href="assets/ordering/homepage-manager.css?v=homepage-1">
  <link rel="stylesheet" href="assets/ordering/newsletter-manager.css?v=offer-templates-1">
</head>
<body class="manage-page">
  <a class="skip-link" href="#workspace">Skip to dashboard</a>
  <header class="topbar admin-topbar">
    <a class="brand" href="index.html"><img src="assets/img/brands/Hatblack.png" alt="" width="42" height="42"><span>The Little Baker Kitchen<small>Kitchen dashboard</small></span></a>
    <nav class="nav-links" aria-label="Quick links"><a href="shop.html">View shop <span aria-hidden="true">↗</span></a><a href="account.html" id="account-link">My account</a></nav>
  </header>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <p class="sidebar-caption">YOUR KITCHEN</p>
      <button type="button" class="sidebar-menu-toggle" id="admin-nav-toggle" aria-expanded="false" aria-controls="admin-nav" aria-label="Dashboard menu"><span id="admin-nav-current">Overview</span><span class="sidebar-menu-label">Menu <span class="sidebar-menu-chevron" aria-hidden="true">⌄</span></span></button>
      <nav aria-label="Dashboard sections" id="admin-nav">
        <div class="sidebar-group" role="group" aria-labelledby="nav-operations-title">
          <h2 class="sidebar-group-title" id="nav-operations-title">Operations</h2>
          <button class="sidebar-link" data-view="pos" data-label="Point of sale"><span aria-hidden="true">▣</span>Point of sale</button>
          <button class="sidebar-link active" data-view="overview" data-label="Overview"><span aria-hidden="true">◫</span>Overview</button>
          <button class="sidebar-link" data-view="orders" data-label="Orders"><span aria-hidden="true">☷</span>Orders<span id="review-count" class="nav-count" hidden></span></button>
          <button class="sidebar-link" data-view="calendar" data-label="Calendar"><span aria-hidden="true">▦</span>Calendar</button>
        </div>
        <div class="sidebar-group" role="group" aria-labelledby="nav-catalog-title">
          <h2 class="sidebar-group-title" id="nav-catalog-title">Catalog</h2>
          <button class="sidebar-link" data-view="products" data-label="Products"><span aria-hidden="true">▧</span>Products</button>
          <button class="sidebar-link" data-view="inventory" data-label="Daily quantities"><span aria-hidden="true">▦</span>Daily quantities</button>
          <button class="sidebar-link" data-view="packages" data-label="Party packages"><span aria-hidden="true">♧</span>Party packages</button>
          <button class="sidebar-link" data-view="dessert" data-label="Dessert bar"><span aria-hidden="true">♧</span>Dessert bar</button>
        </div>
        <div class="sidebar-group" role="group" aria-labelledby="nav-website-title">
          <h2 class="sidebar-group-title" id="nav-website-title">Website</h2>
          <button class="sidebar-link" data-view="homepage" data-label="Home page" style="display:none"><span aria-hidden="true">⌂</span>Home page</button>
          <button class="sidebar-link" data-view="academy" data-label="Academy" style="display:none"><span aria-hidden="true">▤</span>Academy</button>
          <button class="sidebar-link" data-view="galleries" data-label="Photo galleries"><span aria-hidden="true">▧</span>Photo galleries</button>
        </div>
        <div class="sidebar-group" role="group" aria-labelledby="nav-marketing-title">
          <h2 class="sidebar-group-title" id="nav-marketing-title">Marketing</h2>
          <button class="sidebar-link" data-view="newsletters" data-label="Newsletters" style="display:none"><span aria-hidden="true">✉</span>Newsletters</button>
          <button class="sidebar-link" data-view="promos" data-label="Promo codes"><span aria-hidden="true">◇</span>Promo codes</button>
        </div>
        <div class="sidebar-group" role="group" aria-labelledby="nav-reports-title">
          <h2 class="sidebar-group-title" id="nav-reports-title">Reports</h2>
          <button class="sidebar-link" data-view="analytics" data-label="Analytics"><span aria-hidden="true">▥</span>Analytics</button>
          <button class="sidebar-link" data-view="accounting" data-label="Accounting" style="display:none"><span aria-hidden="true">▤</span>Accounting</button>
        </div>
        <div class="sidebar-group" role="group" aria-labelledby="nav-settings-title">
          <h2 class="sidebar-group-title" id="nav-settings-title">Settings</h2>
          <button class="sidebar-link" data-view="settings" data-label="Shop settings"><span aria-hidden="true">⚙</span>Shop settings</button>
          <button class="sidebar-link" data-view="team" data-label="Team access"><span aria-hidden="true">♧</span>Team access</button>
        </div>
      </nav>
      <div class="sidebar-footer"><span class="status-dot"></span><span id="shop-status">Checking connection</span><small>PHP · Asia/Manila</small></div>
    </aside>
    <main id="workspace" class="admin-workspace" tabindex="-1" aria-live="polite"><div class="empty-state"><p>Opening your kitchen dashboard…</p></div></main>
  </div>
  <dialog closedby="none" id="admin-dialog" aria-labelledby="dialog-title"><div class="dialog-shell"><div class="dialog-top"><h2 id="dialog-title"></h2><button type="button" class="icon-button" id="dialog-close" aria-label="Close dialog">×</button></div><div id="dialog-body"></div></div></dialog>
  <noscript><p class="notice">JavaScript is needed to manage your shop. Please enable it and reload.</p></noscript>
  <script type="module" src="assets/ordering/manage.js?v=package-tools-1"></script>
</body>
</html>
